services:
  searxng:
    image: searxng/searxng:latest
    container_name: salesanalizer-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=salesanalizer_searxng_secret_32bytes_key!
      - SEARXNG_URL_FORMAT=json
      - SEARXNG_BASE_URL=http://searxng:8080/
    networks:
      - internal-net

  salesanalizer-backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ericzapater}/salesanalizer-backend:latest
    container_name: salesanalizer-backend
    restart: unless-stopped
    depends_on:
      - searxng
    env_file:
      - .env.backend
    environment:
      - TZ=Europe/Madrid
      - SEARXNG_URL=http://searxng:8080
    networks:
      - postgres-network
      - web
      - internal-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.salesanalizer-backend.rule=Host(`api.salesanalizer.ericzapater.cat`)"
      - "traefik.http.routers.salesanalizer-backend.entrypoints=websecure"
      - "traefik.http.routers.salesanalizer-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.salesanalizer-backend.service=salesanalizer-backend"
      - "traefik.http.services.salesanalizer-backend.loadbalancer.server.port=8080"
      - "traefik.docker.network=web"

  salesanalizer-frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-ericzapater}/salesanalizer-frontend:latest
    container_name: salesanalizer-frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.salesanalizer-frontend.rule=Host(`salesanalizer.ericzapater.cat`)"
      - "traefik.http.routers.salesanalizer-frontend.entrypoints=websecure"
      - "traefik.http.routers.salesanalizer-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.salesanalizer-frontend.service=salesanalizer-frontend"
      - "traefik.http.services.salesanalizer-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=web"

networks:
  web:
    external: true
  postgres-network:
    external: true
  internal-net:
    driver: bridge
