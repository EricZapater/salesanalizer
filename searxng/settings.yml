# Configuration for internal SearXNG instance
use_default_settings: true

general:
  debug: false
  instance_name: "SalesAnalizer-Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ca"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "salesanalizer_searxng_secret_32bytes_key!"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

