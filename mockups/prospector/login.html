<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesAnalizer — Accés Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #1565c0;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --radius: 12px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(25, 118, 210, 0.15);
      border: 1px solid rgba(25, 118, 210, 0.4);
      padding: 6px 14px;
      border-radius: 9999px;
      color: #60a5fa;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:hover {
      background: var(--primary-dark);
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    /* Notification / Error mockup state */
    .mockup-switch {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    body.show-error .error-banner {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body.show-error input[type="password"] {
      border-color: var(--error);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-badge">
      <span>⚡</span> SalesAnalizer Prospector
    </div>
    <h1>Accés intern</h1>
    <p class="subtitle">Introdueix la clau mestra d'administrador (<code>ADMIN_SECRET</code>) per accedir al radar.</p>

    <div class="error-banner">
      <span>⚠️</span> Clau d'administrador incorrecta. Accés denegat.
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='radar_dashboard.html';">
      <div class="form-group">
        <label for="admin-secret">Clau d'accés mestra</label>
        <input type="password" id="admin-secret" placeholder="••••••••••••••••" value="sales_analizer_secret_key" autofocus>
      </div>

      <button type="submit" class="btn-submit">Entrar al Radar</button>
    </form>

    <div class="footer-note">
      Eina d'ús exclusivament intern • Cost d'operació 0€
    </div>

    <div class="mockup-switch">
      <strong>Estat del Mockup:</strong> 
      <button onclick="document.body.classList.toggle('show-error')" style="margin-left: 8px; padding: 3px 8px; font-size: 11px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Alternar estat Error 401</button>
    </div>
  </div>

</body>
</html>
